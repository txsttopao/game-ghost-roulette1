<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost's Roulette: Spell to Survive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========================================== -->
    <!-- หน้า 1: MAIN MENU -->
    <!-- ========================================== -->
    <div id="main-menu-screen" class="screen-container">
        <h1 class="title-text">GHOST ROULETTE!</h1>
        <div class="menu-buttons">
            <button onclick="showScreen('join-room-screen'); renderRooms();">JOIN ROOM</button>
            <button onclick="showScreen('create-room-screen')">CREATE ROOM</button>
            <button>Rule</button>
            <button>SETTING</button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- หน้า 2: JOIN ROOM -->
    <!-- ========================================== -->
    <div id="join-room-screen" class="screen-container hidden">
        <button class="back-btn" onclick="showScreen('main-menu-screen')">⬅ กลับ</button>
        <h1 class="title-text">JOIN ROOM</h1>
        <div class="room-grid" id="room-grid"></div>
    </div>

    <!-- ========================================== -->
    <!-- หน้า 3: CREATE ROOM -->
    <!-- ========================================== -->
    <div id="create-room-screen" class="screen-container hidden">
        <button class="back-btn" onclick="showScreen('main-menu-screen')">⬅ กลับ</button>
        <h1 class="title-text">CREATE ROOM</h1>
        
        <input type="text" id="new-room-name" placeholder="NAME ROOM" class="create-input" autocomplete="off">
        
        <div class="size-selector">
            <button id="btn-size-3" class="size-btn selected" onclick="selectRoomSize(3)">3</button>
            <button id="btn-size-5" class="size-btn" onclick="selectRoomSize(5)">5</button>
        </div>
        
        <button class="create-submit-btn" onclick="createNewRoom()">CREATE</button>
    </div>

    <!-- ========================================== -->
    <!-- หน้า 4: GAME BOARD -->
    <!-- ========================================== -->
    <div class="game-board hidden" id="game-board-screen">
        
        <!-- ศัตรูคนที่ 1-4 -->
        <div class="player enemy" id="player-1"><div class="hp" id="hp-1">🩸🩸🩸</div><div class="name">Enemy 1</div><div class="cards-hidden">🎴</div></div>
        <div class="player enemy" id="player-2"><div class="hp" id="hp-2">🩸🩸🩸</div><div class="name">Enemy 2</div><div class="cards-hidden">🎴</div></div>
        <div class="player enemy" id="player-3"><div class="hp" id="hp-3">🩸🩸🩸</div><div class="name">Enemy 3</div><div class="cards-hidden">🎴</div></div>
        <div class="player enemy" id="player-4"><div class="hp" id="hp-4">🩸🩸🩸</div><div class="name">Enemy 4</div><div class="cards-hidden">🎴</div></div>

        <!-- ตัวเรา -->
        <div class="player self" id="player-0">
            <div class="hp" id="hp-0">🩸🩸🩸</div>
            <div class="name">YOU (คุณ)</div>
            <div class="my-cards" id="my-cards-container"></div>
        </div>

        <!-- โต๊ะตรงกลาง -->
        <div class="center-table">
            <div class="cross-status" id="cross-status">
                ✝️ จริง: 3 | ✝️ ปลอม: 2<br>
                <span style="font-size: 14px; color: #aaa;">สถานะ: 5/0</span>
            </div>
            <div class="prompt-box"><span id="target-letter">?</span> _ _ _</div>
            <div id="timer-display">เวลา: <span id="time" style="color: #ffeb3b;">0</span> วินาที</div>
            <input type="text" id="word-input" placeholder="พิมพ์ศัพท์..." autocomplete="off" disabled>
            <div id="message-box">รอระบบโหลดพจนานุกรมออนไลน์...</div>
            <button id="start-btn" onclick="startNormalTurn()">เริ่มเทิร์น</button>
            <div id="target-selection" class="hidden"></div>
        </div>

        <!-- กล่องบันทึกการเล่น (Action Log) -->
        <div id="action-log" class="action-log">
            <div class="log-title">📜 ประวัติการโจมตี</div>
            <div id="log-content" class="log-content"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
